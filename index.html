<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SDK Flow Diagrams — Interactive</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --host: #2563eb;
    --host-bg: #eff6ff;
    --sdk: #7c3aed;
    --sdk-bg: #f5f3ff;
    --green: #16a34a;
    --red: #dc2626;
    --amber: #d97706;
    --sidebar-w: 260px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }
  body { background: #060d1a; }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(55vw 55vw at 6% 8%,   rgba(59, 130, 246, 0.18), transparent 60%),
      radial-gradient(55vw 55vw at 94% 94%, rgba(139, 92, 246, 0.14), transparent 60%),
      radial-gradient(45vw 45vw at 60% 40%, rgba(56, 189, 248, 0.10), transparent 65%);
  }
  .bg-circuit {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
    opacity: 0.85;
  }
  .app { display: flex; height: 100vh; position: relative; z-index: 1; }

  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .sidebar-header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .sidebar-header p { margin: 0; color: var(--muted); font-size: 11px; }
  .sidebar-section { padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar-section h3 {
    margin: 0 0 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    font-weight: 600;
    padding: 0 6px;
  }

  .modules { display: flex; flex-direction: column; gap: 2px; }
  .module {
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-align: left;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-family: inherit;
  }
  .module:hover { background: var(--panel-2); }
  .module.active { background: var(--host-bg); border-color: #bfdbfe; }
  .module strong { font-size: 13px; font-weight: 600; color: var(--text); }
  .module .module-sub { font-size: 11px; color: var(--muted); }
  .module .module-count { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .view-toggle { display: flex; background: var(--panel-2); border-radius: 6px; padding: 2px; }
  .view-toggle button {
    flex: 1; background: transparent; border: none; color: var(--muted);
    padding: 6px 10px; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-weight: 500; font-family: inherit;
    transition: all 0.15s ease;
  }
  .view-toggle button.active {
    background: white; color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  .controls { display: flex; flex-direction: column; gap: 6px; }
  .controls button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    font-family: inherit; text-align: left; transition: all 0.15s ease;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }

  .legend { display: flex; flex-direction: column; gap: 8px; padding: 0 6px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .badge-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; flex-shrink: 0; }
  .badge-swatch.host { background: var(--host-bg); border-color: #bfdbfe; }
  .badge-swatch.sdk  { background: var(--sdk-bg);  border-color: #ddd6fe; }
  .badge-swatch.returns { background: #ecfdf5; border-color: #a7f3d0; }

  .main { flex: 1; overflow: auto; display: flex; flex-direction: column; background: transparent; }
  .main-header {
    padding: 18px 24px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }
  .main-header h2 { margin: 0 0 2px; font-size: 18px; font-weight: 600; }
  .main-header p { margin: 0; color: var(--muted); font-size: 12px; }
  .progress { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .flow-scroll { flex: 1; overflow: auto; padding: 40px 32px 60px; }

  .badge {
    display: inline-block;
    padding: 2px 7px; border-radius: 4px;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.6px; text-transform: uppercase;
    border: 1px solid;
  }
  .badge.host { color: var(--host); background: var(--host-bg); border-color: #bfdbfe; }
  .badge.sdk  { color: var(--sdk);  background: var(--sdk-bg);  border-color: #ddd6fe; }

  .returns-pill {
    display: inline-flex; align-items: center; gap: 3px;
    background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
    padding: 2px 6px; border-radius: 4px;
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.3px; text-transform: uppercase;
  }
  .returns-pill::before { content: "↩"; font-size: 12px; line-height: 1; }

  /* Snake flow */
  .flow { display: none; flex-direction: column; gap: 40px; padding-bottom: 30px; }
  .flow.active { display: flex; }
  .flow-row { display: flex; gap: 30px; align-items: flex-start; position: relative; }
  .flow-row.rtl { flex-direction: row-reverse; }

  .flow-item { flex-shrink: 0; position: relative; }
  .flow-item::after {
    content: ''; position: absolute;
    top: 54px; right: -22px;
    width: 16px; height: 0;
    border-top: 2px solid rgba(148, 163, 184, 0.65);
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .flow-item::before {
    content: ''; position: absolute;
    top: 50px; right: -22px;
    border-left: 7px solid rgba(148, 163, 184, 0.65);
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .flow-item.visible::after, .flow-item.visible::before { opacity: 1; }
  .flow-row.rtl .flow-item::after { right: auto; left: -22px; }
  .flow-row.rtl .flow-item::before {
    right: auto; left: -22px;
    border-left: none;
    border-right: 7px solid rgba(148, 163, 184, 0.65);
  }
  .flow-row .flow-item:last-child::after,
  .flow-row .flow-item:last-child::before { display: none; }

  .row-turn {
    width: 100%; height: 0; position: relative; pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .row-turn.visible { opacity: 1; }
  .row-turn svg {
    position: absolute; top: -34px;
    width: 60px; height: 80px; overflow: visible;
  }
  .row-turn.right svg { right: 88px; }
  .row-turn.left svg { left: 88px; }

  /* Node card */
  .node {
    width: 240px; opacity: 0; transform: translateY(-4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .node.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .node-card {
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 110px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .node-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .node-card.expanded { border-color: var(--accent); box-shadow: 0 2px 12px rgba(37, 99, 235, 0.1); }
  .node-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 6px; flex-wrap: wrap;
  }
  .node-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.1px;
    color: var(--muted); font-weight: 600;
  }
  .node-title {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; color: var(--text); font-weight: 600;
    line-height: 1.4; word-break: break-word;
  }
  .node[data-type="start"] .node-title,
  .node[data-type="end"] .node-title {
    font-family: inherit; text-align: center;
  }
  .node-detail {
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease, margin-top 0.35s ease, padding-top 0.35s ease;
    color: var(--muted); font-size: 12px; line-height: 1.55;
  }
  .node-card.expanded .node-detail {
    max-height: 600px; margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .callback-tag {
    display: inline-block;
    background: var(--sdk-bg); color: var(--sdk);
    border: 1px solid #ddd6fe;
    padding: 3px 7px; border-radius: 4px;
    font-size: 10px; margin-top: 6px;
    font-family: "SF Mono", Menlo, monospace;
  }
  .callback-tag::before {
    content: "SDK → Host: ";
    color: #475569; font-weight: 700; letter-spacing: 0.3px;
  }
  .behind-the-scenes {
    margin-top: 8px; padding: 6px 8px;
    background: #f8fafc; border: 1px dashed var(--border);
    border-radius: 6px;
    font-size: 10px; color: var(--muted);
    font-family: "SF Mono", Menlo, monospace; line-height: 1.5;
  }
  .behind-the-scenes::before {
    content: "Behind the scenes: ";
    color: var(--sdk); font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .click-hint {
    display: inline-block; font-size: 9px; color: var(--accent);
    margin-left: 4px; animation: pulse 1.8s infinite;
  }
  .node-card.expanded .click-hint { display: none; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  .node[data-type="start"] .node-card,
  .node[data-type="end"] .node-card {
    background: var(--text); color: white;
    border-radius: 12px; text-align: center;
    justify-content: center; min-height: 110px;
  }
  .node[data-type="start"] .node-title,
  .node[data-type="end"] .node-title { color: white; }
  .node[data-type="start"] .node-detail,
  .node[data-type="end"] .node-detail { color: rgba(255,255,255,0.85); }
  .node[data-type="start"] .node-header,
  .node[data-type="end"] .node-header { justify-content: center; }

  .node[data-type="setup"] .node-card { border-left: 3px solid #14b8a6; }
  .node[data-type="capture"] .node-card { border-left: 3px solid #f59e0b; }
  .node[data-type="ocr"] .node-card { border-left: 3px solid #3b82f6; }
  .node[data-type="validate"] .node-card { border-left: 3px solid #8b5cf6; }
  .node[data-type="sync"] .node-card { border-left: 3px solid #eab308; }
  .node[data-type="api"] .node-card { border-left: 3px solid #64748b; background: rgba(248, 250, 252, 0.96); }
  .node[data-type="fail"] .node-card { border-left: 3px solid var(--red); background: rgba(254, 242, 242, 0.96); }
  .node[data-type="screen"] .node-card { border-left: 3px solid #38bdf8; background: rgba(240, 249, 255, 0.96); }
  .node[data-type="action"] .node-card { border-left: 3px solid #10b981; background: rgba(240, 253, 244, 0.96); }
  .node[data-type="wait"] .node-card { border-left: 3px solid #f59e0b; background: rgba(255, 251, 235, 0.96); }
  .node[data-type="feedback"] .node-card { border-left: 3px solid #a855f7; background: rgba(250, 245, 255, 0.96); }

  /* Decision — full-width vertical block with YES/NO lanes */
  .decision-row {
    width: 100%;
    padding: 8px 0;
    display: flex;
    justify-content: center;
  }
  .decision-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: 100%;
    max-width: 900px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .decision-block.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .decision-card-large {
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 2px solid var(--amber);
    border-radius: 12px;
    padding: 14px 22px;
    min-width: 220px;
    max-width: 320px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    cursor: pointer;
    position: relative;
    box-shadow: 0 4px 16px rgba(217, 119, 6, 0.18);
    transition: all 0.15s ease;
  }
  .decision-card-large:hover { background: #fffbeb; }
  .decision-card-large .decision-q {
    font-size: 14px;
    font-weight: 700;
    color: var(--amber);
    letter-spacing: 0.3px;
  }
  .decision-card-large .decision-hint {
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }
  .decision-card-large .decision-arrow-down {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--amber);
    opacity: 0;
    transition: opacity 0.3s ease;
    font-size: 14px;
    background: white;
    border: 1.5px solid var(--amber);
    border-radius: 999px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .decision-block.expanded .decision-card-large .decision-arrow-down { opacity: 1; }

  .branches-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    width: 100%;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, max-height 0.5s ease;
    pointer-events: none;
  }
  .branches-2col.visible {
    opacity: 1;
    max-height: 3000px;
    pointer-events: auto;
  }

  .branch-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 18px 14px 16px;
    border-radius: 14px;
    position: relative;
  }
  .branch-column.yes {
    background: rgba(16, 185, 129, 0.07);
    border: 1px dashed rgba(16, 185, 129, 0.35);
  }
  .branch-column.no {
    background: rgba(220, 38, 38, 0.07);
    border: 1px dashed rgba(220, 38, 38, 0.35);
  }
  .branch-banner {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    padding: 6px 18px;
    border-radius: 999px;
    color: white;
    display: inline-block;
  }
  .branch-banner.yes { background: var(--green); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3); }
  .branch-banner.no { background: var(--red); box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3); }

  /* Cards inside branch columns: full-width within the column, no snake-arrows */
  .branch-column .node { width: 100%; max-width: 320px; }
  .branch-column .flow-item::after,
  .branch-column .flow-item::before { display: none !important; }

  /* Nested decision block inside a branch column */
  .branch-column .decision-block {
    gap: 14px;
    max-width: 100%;
  }
  .branch-column .decision-card-large {
    min-width: 180px;
    max-width: 260px;
    padding: 12px 16px;
  }
  .branch-column .decision-card-large .decision-q { font-size: 13px; }
  .branch-column .branches-2col {
    gap: 12px;
  }
  .branch-column .branch-column {
    padding: 12px 10px;
    gap: 10px;
  }
  .branch-column .branch-banner {
    font-size: 10px;
    padding: 4px 12px;
    letter-spacing: 1.3px;
  }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .main-header { padding: 12px 16px; }
    .flow-scroll { padding: 24px 16px 40px; }
  }
</style>
</head>

function buildNode(step) {
  // Top-level decisions are rendered separately in renderFlow.
  // buildNode is for regular steps only (and is called recursively from buildDecision for branch children).
  if (step.type === 'decision') return buildDecision(step, { nested: true });

  const node = document.createElement('div');
  node.className = 'node flow-item';
  node.dataset.type = step.type;
  node.dataset.id = step.id;

  const card = document.createElement('div');
  card.className = 'node-card';

  let header = '<div class="node-header"><div>';
  if (step.label) header += '<span class="node-label">' + step.label + '</span>';
  header += '</div><div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">';
  if (step.owner) header += ownerBadge(step.owner);
  if (step.callback) header += '<span class="returns-pill">returns</span>';
  header += '</div></div>';

  let html = header;
  html += '<div class="node-title">' + step.title + '<span class="click-hint">▾</span></div>';
  html += '<div class="node-detail">' + (step.detail || '');
  if (step.callback) html += '<div class="callback-tag">' + step.callback + '</div>';
  if (step.behind) html += '<div class="behind-the-scenes">' + step.behind + '</div>';
  html += '</div>';
  card.innerHTML = html;

  node.appendChild(card);
  return node;
}

function buildDecision(step, opts) {
  opts = opts || {};
  const block = document.createElement('div');
  block.className = 'decision-block' + (opts.nested ? ' nested' : ' flow-item');
  block.dataset.id = step.id;

  const card = document.createElement('div');
  card.className = 'decision-card-large';
  card.innerHTML =
    '<div class="decision-q">' + step.question + '</div>' +
    '<div class="decision-hint">' + (step.hint || '') + '</div>' +
    '<div>' + ownerBadge(step.owner || 'sdk') + '</div>' +
    '<div class="decision-arrow-down">▾</div>';
  block.appendChild(card);

  const branchesWrap = document.createElement('div');
  branchesWrap.className = 'branches-2col';

  ['yes', 'no'].forEach(side => {
    if (!step.branches[side]) return;
    const column = document.createElement('div');
    column.className = 'branch-column ' + side;

    const banner = document.createElement('div');
    banner.className = 'branch-banner ' + side;
    banner.textContent = side.toUpperCase();
    column.appendChild(banner);

    step.branches[side].forEach(child => {
      let childEl;
      if (child.type === 'decision') {
        childEl = buildDecision(child, { nested: true });
        childEl.classList.add('visible');
        if (childEl._branchesWrap) childEl._branchesWrap.classList.add('visible');
        if (childEl._cardEl) childEl._cardEl.classList.add('auto-expanded');
      } else {
        childEl = buildNode(child);
        childEl.classList.add('visible');
      }
      column.appendChild(childEl);
    });

    branchesWrap.appendChild(column);
  });

  block.appendChild(branchesWrap);
  block._cardEl = card;
  block._branchesWrap = branchesWrap;
  return block;
}

function getStepsPerRow() {
  const scroller = document.querySelector('.flow-scroll');
  const avail = scroller ? scroller.clientWidth - 60 : window.innerWidth - 320;
  const cardW = 240, gap = 30;
  return Math.max(2, Math.floor((avail + gap) / (cardW + gap)));
}

function makeTurnSvg(side) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 60 80');
  const path = document.createElementNS(ns, 'path');
  const stroke = 'rgba(148, 163, 184, 0.7)';
  if (side === 'right') {
    path.setAttribute('d', 'M 0 0 H 50 a 8 8 0 0 1 8 8 V 72 a 8 8 0 0 1 -8 8 H 0');
  } else {
    path.setAttribute('d', 'M 60 0 H 10 a 8 8 0 0 0 -8 8 V 72 a 8 8 0 0 0 8 8 H 60');
  }
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', stroke);
  path.setAttribute('stroke-width', '2');
  svg.appendChild(path);
  const tri = document.createElementNS(ns, 'polygon');
  if (side === 'right') {
    tri.setAttribute('points', '8,76 -2,80 8,84');
  } else {
    tri.setAttribute('points', '52,76 62,80 52,84');
  }
  tri.setAttribute('fill', stroke);
  svg.appendChild(tri);
  return svg;
}

function renderFlow(key) {
  const flow = flows[key];
  const root = container[key];
  root.innerHTML = '';

  const stepList = currentView === 'user' ? (flow.userSteps || flow.steps) : flow.steps;
  const perRow = getStepsPerRow();

  let row = null;
  let rowIdx = 0;
  let stepsInRow = 0;

  function startSnakeRow() {
    const isRtl = rowIdx % 2 === 1;
    row = document.createElement('div');
    row.className = 'flow-row ' + (isRtl ? 'rtl' : 'ltr');
    root.appendChild(row);
    rowIdx++;
    stepsInRow = 0;
  }

  function addUTurn() {
    const finishedWasLtr = ((rowIdx - 1) % 2 === 0);
    const turn = document.createElement('div');
    turn.className = 'row-turn ' + (finishedWasLtr ? 'right' : 'left');
    turn.appendChild(makeTurnSvg(finishedWasLtr ? 'right' : 'left'));
    root.appendChild(turn);
  }

  stepList.forEach(step => {
    if (step.type === 'decision') {
      // Decision becomes its own full-width row, breaking the snake.
      row = null;
      stepsInRow = 0;
      rowIdx = 0;

      const decisionRow = document.createElement('div');
      decisionRow.className = 'decision-row';
      decisionRow.appendChild(buildDecision(step));
      root.appendChild(decisionRow);
    } else {
      if (!row || stepsInRow >= perRow) {
        if (row && stepsInRow > 0) addUTurn();
        startSnakeRow();
      }
      row.appendChild(buildNode(step));
      stepsInRow++;
    }
  });

  // Reveal first flow-item (the first .node in row 1, or first decision-block)
  const firstFlowItem = root.querySelector('.flow-item');
  if (firstFlowItem) firstFlowItem.classList.add('visible');

  attachHandlers(root);
  updateActiveHeader();
  updateProgress();
}

function attachHandlers(root) {
  root.querySelectorAll('.node').forEach(node => {
    const card = node.querySelector('.node-card');
    card.addEventListener('click', () => {
      card.classList.toggle('expanded');
      revealNext(node);
      updateProgress();
    });
  });
  // Top-level decision-blocks (.flow-item)
  root.querySelectorAll('.decision-block.flow-item').forEach(block => {
    const card = block._cardEl;
    const branches = block._branchesWrap;
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      const opening = !branches.classList.contains('visible');
      branches.classList.toggle('visible');
      block.classList.toggle('expanded', opening);
      if (opening) revealNext(block, { scroll: false });
      updateProgress();
    });
  });
  // Nested decision-blocks (inside a branch column) — toggle locally, don't trigger main-flow reveal
  root.querySelectorAll('.decision-block.nested').forEach(block => {
    const card = block._cardEl;
    const branches = block._branchesWrap;
    if (card._wired) return;
    card._wired = true;
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      branches.classList.toggle('visible');
      block.classList.toggle('expanded');
    });
  });
}

function getTopLevelItems(root) {
  const items = [];
  Array.from(root.children).forEach(child => {
    if (child.classList.contains('flow-row')) {
      Array.from(child.children).forEach(c => {
        if (c.classList && c.classList.contains('flow-item')) items.push(c);
      });
    } else if (child.classList.contains('decision-row')) {
      const block = child.querySelector(':scope > .flow-item');
      if (block) items.push(block);
    }
  });
  return items;
}

function revealNext(currentItem, opts) {
  opts = opts || {};
  const root = currentItem.closest('.flow');
  if (!root) return;
  const items = getTopLevelItems(root);
  const idx = items.indexOf(currentItem);
  if (idx < 0 || idx >= items.length - 1) return;
  const next = items[idx + 1];

  // Reveal any row-turn elements between current's parent and next's parent
  let walker = currentItem.parentElement.nextElementSibling;
  while (walker && walker !== next.parentElement) {
    if (walker.classList.contains('row-turn')) walker.classList.add('visible');
    walker = walker.nextElementSibling;
  }

  next.classList.add('visible');
  if (opts.scroll !== false) scrollIntoFlowView(next);
}

function scrollIntoFlowView(el) {
  const scroller = document.querySelector('.flow-scroll');
  if (!scroller || !el) return;
  requestAnimationFrame(() => {
    const elRect = el.getBoundingClientRect();
    const scRect = scroller.getBoundingClientRect();
    let dx = 0, dy = 0;
    const margin = 40;
    if (elRect.bottom > scRect.bottom - margin) dy = elRect.bottom - scRect.bottom + margin;
    else if (elRect.top < scRect.top + margin) dy = elRect.top - scRect.top - margin;
    if (elRect.right > scRect.right - margin) dx = elRect.right - scRect.right + margin;
    else if (elRect.left < scRect.left + margin) dx = elRect.left - scRect.left - margin;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
      scroller.scrollBy({ left: dx, top: dy, behavior: 'smooth' });
    }
  });
}

function updateProgress() {
  const active = document.querySelector('.module.active').dataset.flow;
  const root = container[active];
  const items = getTopLevelItems(root);
  const total = items.length;
  let visible = 0;
  items.forEach(it => { if (it.classList.contains('visible')) visible++; });
  document.getElementById('progress').textContent = visible + ' / ' + total + ' revealed';
}

function updateActiveHeader() {
  const active = document.querySelector('.module.active').dataset.flow;
  const flow = flows[active];
  document.getElementById('active-title').textContent = flow.title;
  document.getElementById('active-subtitle').textContent = currentView === 'user' ? flow.userSubtitle : flow.subtitle;
}

function resetScroll() {
  const scroller = document.querySelector('.flow-scroll');
  if (scroller) scroller.scrollTo({ left: 0, top: 0, behavior: 'smooth' });
}

document.querySelectorAll('.module').forEach(mod => {
  mod.addEventListener('click', () => {
    document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
    mod.classList.add('active');
    document.querySelectorAll('.flow').forEach(f => f.classList.remove('active'));
    document.getElementById('flow-' + mod.dataset.flow).classList.add('active');
    updateActiveHeader();
    updateProgress();
    resetScroll();
  });
});

document.querySelectorAll('.view-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    ['posm', 'ocr', 'ir'].forEach(renderFlow);
    resetScroll();
  });
});

document.getElementById('expand-all').addEventListener('click', () => {
  const active = document.querySelector('.module.active').dataset.flow;
  const root = container[active];
  root.querySelectorAll('.flow-item, .node, .row-turn, .decision-block').forEach(n => n.classList.add('visible'));
  root.querySelectorAll('.branches-2col').forEach(b => b.classList.add('visible'));
  root.querySelectorAll('.decision-block').forEach(b => b.classList.add('expanded'));
  root.querySelectorAll('.node-card').forEach(c => c.classList.add('expanded'));
  updateProgress();
  resetScroll();
});

document.getElementById('reset').addEventListener('click', () => {
  const active = document.querySelector('.module.active').dataset.flow;
  renderFlow(active);
  resetScroll();
});

let resizeTimer = null;
let lastPerRow = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const perRow = getStepsPerRow();
    if (perRow !== lastPerRow) {
      lastPerRow = perRow;
      ['posm', 'ocr', 'ir'].forEach(renderFlow);
    }
  }, 180);
});

['posm', 'ocr', 'ir'].forEach(key => {
  renderFlow(key);
  const sdkCount = flows[key].steps.length;
  const el = document.getElementById('count-' + key);
  if (el) el.textContent = sdkCount + ' steps';
});
lastPerRow = getStepsPerRow();

updateActiveHeader();
updateProgress();
</script>
</body>
</html>
